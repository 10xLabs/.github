name: Repo Setup

on:
  push:
    branches:
      - master
  schedule:
    - cron: 0 0 * * *

jobs:
  repo_setup:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Setup
        uses: rakambda/github-action-repo-settings-sync@v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          REPOSITORIES: |
            10xLabs/kolvan
          ALLOW_ISSUES: false
          ALLOW_PROJECTS: false
          ALLOW_WIKI: false
          IS_TEMPLATE: false
          SQUASH_MERGE: true
          MERGE_COMMIT: true
          REBASE_MERGE: true
          AUTO_MERGE: true
          ALLOW_UPDATE_BRANCH: true
          DELETE_HEAD: true
          SQUASH_PR_TITLE: COMMIT_OR_PR_TITLE
          SQUASH_PR_MESSAGE: COMMIT_MESSAGES
          ACTION_ACCESS_LEVEL: none
          RULESET_DEFINITIONS: |
            ./example-ruleset.json
          ACTION_SECRETS: KEY1=VAL1
            KEY2=VAL2
